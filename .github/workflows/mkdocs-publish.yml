name: Docs pipeline
run-name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The docs toolchain needs >=3.11 (mkdocstrings-python 2.x); the library
          # itself still supports 3.10, which is why docs/requirements.txt exists
          # instead of a poetry group.
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          pip install -r docs/requirements.txt .
          pip install "yt-dlp>=2025.1.1"

      - name: Publish docs
        run: mkdocs gh-deploy --force --clean
